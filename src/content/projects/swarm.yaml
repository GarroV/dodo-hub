login_steps:
  - ru: Вход только по приглашению. Попросите администратора Swarm добавить вашу почту @dodobrands.io в список доступа.
    en: Access is invite-only. Ask a Swarm admin to add your @dodobrands.io email to the access list.
  - ru: Откройте веб и войдите через «Sign in with Google» корпоративной почтой или через «Sign in with Telegram».
    en: Open the web app and sign in with “Sign in with Google” using your corporate email, or with “Sign in with Telegram”.
  - ru: В Telegram откройте бота @swarm_brain_bot и пишите ему вопросы и заметки. Подключить Claude Desktop или рекордер bumblebee — в вебе, раздел «Настройки».
    en: In Telegram, open the @swarm_brain_bot bot and send it questions and notes. To connect Claude Desktop or the bumblebee recorder, go to Settings in the web app.
