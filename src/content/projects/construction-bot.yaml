# Факты — из репозитория GarroV/construction_bot (ветка main), карты хозяйства
# и getMe работающего бота. Доски в Swarm нет и не будет: проект уже просто работает.
order: 4
name: Construction bot
repo: GarroV/construction_bot
repo_public: false        # gh repo view: PRIVATE (28.09.2026) — ссылку не показываем
status: live             # решение владельца 28.09.2026: «работает»
size: sm
glyph: building
tint: violet
swarm_project_id: null
owner: Vasiliy Garro
kind:
  ru: Telegram-бот
  en: Telegram bot
summary:
  ru: Выжимки по стройкам пиццерий из задач Битрикс24 — несколько раз в день в топик странового чата партнёра.
  en: Digests on pizzeria construction from Bitrix24 tasks, several times a day, in the topic of the partner’s country chat.
audience:
  ru: Владельцы сети и партнёры, у которых идёт стройка
  en: Network owners and partners with a site under construction
runs_on:
  ru: Telegram
  en: Telegram
link:
  url: https://t.me/dodo_constr_bot   # getMe бота на MUSPELHEIM, 28.09.2026
  label:
    ru: Открыть бота
    en: Open the bot
extra_links: []
login_steps:
  - ru: Добавьте бота @dodo_constr_bot в страновой чат партнёра — группу с топиками. Добавить его может тот, у кого в чате есть право добавлять участников.
    en: Add the @dodo_constr_bot bot to the partner’s country chat — a group with topics. Anyone allowed to add members to the chat can do it.
  - ru: В топике стройки отправьте /menu@dodo_constr_bot и нажмите «➕ Добавить карточку», ответив номером задачи Битрикс24 или ссылкой на неё. То же одной командой — /add@dodo_constr_bot 42103. Подзадачи карточки бот подхватит сам.
    en: In the construction topic, send /menu@dodo_constr_bot and tap “➕ Add a card”, replying with the Bitrix24 task number or a link to it. The same in one command — /add@dodo_constr_bot 42103. The bot picks up the card’s subtasks on its own.
  - ru: Язык и часовой пояс бот определит сам по карточке. Поменять — /time 09:00 Белград и /lang ru (или кнопки в /menu). Что отслеживается — /list.
    en: The bot works out the language and time zone from the card. To change them — /time 09:00 Belgrade and /lang en (or the buttons in /menu). To see what is tracked — /list.
  - ru: Дальше всё само — выжимка приходит в 9, 11, 13, 15, 17 и 19 по местному времени, только если по карточкам что-то изменилось. Бот ответил, что карточка не найдена или нет доступа, — напишите владельцу проекта.
    en: After that it runs on its own — a digest arrives at 9, 11, 13, 15, 17 and 19 local time, only when something changed on the cards. If the bot replies that the card is not found or there is no access, contact the project owner.
demo: none               # решение владельца 28.09.2026: демо боту не нужно
