# Каждый день проверяет, что ссылки в карточках хаба живые (адреса продуктов, боты, демо).
# Упал — заводит задачу «Ссылка в хабе не открывается» (или дописывает в открытую),
# GitHub присылает письмо об упавшем прогоне. Токен — встроенный GITHUB_TOKEN, своих секретов нет.
name: Links

on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths: ["src/content/projects/**", "tools/check-links.mjs"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Проверить ссылки
        id: check
        run: npm run check:links 2>&1 | tee links.log; exit "${PIPESTATUS[0]}"
      - name: Завести или дополнить задачу
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Ссылка в хабе не открывается"
          BODY="$(printf 'Прогон: %s\n\n```\n%s\n```\n\nОбновите карточку проекта в src/content/projects/ или почините продукт.' "$RUN_URL" "$(grep -E '✗|Мёртвых' links.log)")"
          N=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number -q '.[0].number')
          if [ -n "$N" ]; then gh issue comment "$N" --body "$BODY"; else gh issue create --title "$TITLE" --body "$BODY"; fi
